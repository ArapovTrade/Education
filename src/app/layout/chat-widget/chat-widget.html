 

<div class="chat-widget">

  <div class="chat-options" [class.open]="isOpen">
    <a [href]="whatsappUrl" target="_blank" rel="noopener" class="chat-icon whatsapp">
      <svg viewBox="0 0 32 32" width="28" height="28" fill="#fff">
        <path d="M16.001 3.2c-7.06 0-12.8 5.74-12.8 12.8 0 2.26.6 4.38 1.63 6.21L3.2 28.8l6.77-1.6a12.74 12.74 0 0 0 6.03 1.53c7.06 0 12.8-5.74 12.8-12.8s-5.74-12.53-12.8-12.53zm0 23.13c-1.95 0-3.85-.52-5.5-1.5l-.4-.24-4.02.95.96-3.9-.26-.4a10.5 10.5 0 0 1-1.6-5.5c0-5.83 4.75-10.58 10.58-10.58s10.4 4.75 10.4 10.58-4.57 10.6-9.76 10.6zm5.8-7.9c-.32-.16-1.87-.92-2.16-1.03-.29-.1-.5-.16-.71.16-.2.32-.82 1.03-1 1.24-.19.2-.37.23-.68.08-.32-.16-1.34-.5-2.55-1.58-.94-.84-1.58-1.87-1.76-2.19-.19-.32-.02-.5.14-.65.14-.14.32-.37.48-.55.16-.19.2-.32.3-.53.1-.2.05-.4-.02-.55-.08-.16-.7-1.7-.97-2.32-.25-.6-.5-.52-.7-.53h-.6c-.2 0-.55.08-.83.4-.29.32-1.1 1.07-1.1 2.6s1.12 3.02 1.28 3.23c.16.2 2.2 3.36 5.34 4.7.75.33 1.33.52 1.79.66.75.24 1.43.2 1.97.13.6-.09 1.87-.76 2.13-1.5.27-.73.27-1.36.19-1.5-.08-.13-.29-.2-.6-.35z"/>
      </svg>
    </a>

    <a [href]="telegramUrl" target="_blank" rel="noopener" class="chat-icon telegram">
      <svg viewBox="0 0 240 240" width="30" height="30" fill="#fff">
        <path d="M188 40 L18 108 c-9 3 -9 9 -2 11 l43 13 17 52 c2 6 4 8 8 8 4 0 6-2 8-5 l19-18 40 30 c7 4 13 2 15-6 l27-127 c3-11-4-16-11-13z M76 141 l89-79 c4-3 8-1 5 2 l-72 87 -3 33 z"/>
      </svg>
    </a>
  </div>

  <button class="chat-toggle" (click)="toggle()" [attr.aria-expanded]="isOpen">
    @if (!isOpen) {
      <svg viewBox="0 0 24 24" width="30" height="30" fill="#fff">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
      </svg>
    }
    @if (isOpen) {
      <svg viewBox="0 0 24 24" width="26" height="26" fill="#fff">
        <path d="M18.3 5.71L12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.7 2.87 18.29 9.17 12 2.87 5.71 4.29 4.29l6.3 6.3 6.29-6.3z"/>
      </svg>
    }
  </button>
</div>
